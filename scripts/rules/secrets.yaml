# Secrets Detection Rules
- id: S001
  title: Hardcoded API Key/Token
  pattern: '(?i)(?:api[_-]?key|access[_-]?token|auth[_-]?token|bearer[_-]?token)["''\s]*[=:]["''\s]*([a-z0-9_-]{20,})'
  severity: critical
  recommendation: Use environment variables or secure credential storage instead
- id: S002
  title: Hardcoded Password
  pattern: '(?i)(?:password|passwd|pwd)["''\s]*[=:]["''\s]*([^"\n''\s]{8,})'
  severity: critical
  recommendation: Use environment variables or secure credential storage instead
- id: S003
  title: Private Key Exposure Risk
  pattern: '-----BEGIN[ A-Z]* PRIVATE KEY-----'
  severity: critical
  recommendation: Never store private keys in source code
- id: S004
  title: Base64 Encoded Secret
  pattern: '(?i)(?:secret|key|token)["''\s]*[=:]["''\s]*([a-z0-9+/]{20,}={0,2})'
  severity: high
  recommendation: Avoid storing encoded secrets in source code
- id: S005
  title: Cloud Provider Credentials Pattern
  pattern: '(?i)(?:aws[_-]?access[_-]?key|azure[_-]?subscription|gcp[_-]?service[_-]?account)'
  severity: critical
  recommendation: Use IAM roles or managed identity instead of hardcoded credentials